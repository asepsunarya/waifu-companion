<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Served by Cyrene's phone server at / (this folder's other files under /phone/, the avatar's renderers and
      vendored libraries at their usual paths), so every URL here is absolute. The page reaches only that server: a
      downloaded model3.json may name https://... or //host/... files, which the Live2D engine would fetch as they
      are. The only inline script is the import map, allowed by its hash (recompute it when the map changes; the
      test in tests/js/phone_page.test.mjs prints the new one). eval stays allowed because PixiJS compiles its
      uniform uploads and the Cubism Core is WebAssembly; data: and blob: URLs are what the page makes itself
      (textures, PixiJS's image workers). Forms are only ever sent by script. The server adds frame-ancestors
      'none', which a meta tag cannot set.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-5NY4WvTiiG9seZcXL7viaFNn6mSCfT3X+lxo3SYve58=' 'unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Cyrene</title>
    <meta name="theme-color" content="#f6f1ff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" />
    <link rel="stylesheet" href="/phone/phone.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three/addons/",
          "@pixiv/three-vrm": "/vendor/three-vrm/three-vrm.module.min.js",
          "pixi.js": "/vendor/pixi/pixi.min.mjs",
          "untitled-pixi-live2d-engine/cubism": "/vendor/live2d-engine/cubism.es.js"
        }
      }
    </script>
    <script type="module" src="/phone/phone.js"></script>
  </head>
  <body data-state="idle">
    <canvas id="stage"></canvas>

    <header id="bar">
      <div id="title">
        <h1 id="name">Cyrene</h1>
        <span id="status" role="status">Siap</span>
      </div>
      <p id="credit"></p>
    </header>

    <div id="boot">
      <p id="message" role="alert">Memuat Cyrene…</p>
      <button id="retry" class="pill" type="button" hidden>Coba lagi</button>
    </div>

    <section id="pairing" hidden>
      <form id="pair-form" novalidate>
        <h1>Pasangkan HP ini</h1>
        <p>
          Di PC, jalankan <code>waifu phone pair</code>, lalu ketik kode 6 angka yang muncul. Kodenya berlaku 10
          menit.
        </p>
        <input
          id="pair-code"
          name="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="11"
          placeholder="000000"
          aria-label="Kode pasangan 6 angka"
          required
        />
        <button id="pair-button" class="pill" type="submit">Pasangkan</button>
        <p id="pair-notice" role="alert" hidden></p>
      </form>
    </section>

    <main id="chat" hidden>
      <ol id="bubbles" aria-live="polite"></ol>
      <p id="notice" role="status" hidden></p>
      <form id="composer" novalidate>
        <textarea
          id="text"
          rows="1"
          maxlength="2000"
          enterkeyhint="send"
          placeholder="Tulis pesan…"
          aria-label="Pesan"
        ></textarea>
        <button id="send" class="round" type="submit" aria-label="Kirim" title="Kirim">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.6 2-12.6 2z" /></svg>
        </button>
        <button
          id="talk"
          class="round"
          type="button"
          aria-pressed="false"
          aria-label="Tahan untuk bicara"
          title="Tahan untuk bicara"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9z"
            />
          </svg>
        </button>
      </form>
    </main>
  </body>
</html>
