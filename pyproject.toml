[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waifu-companion"
version = "0.1.0"
description = "Voice-controlled AI companion that runs a smart home from a Windows PC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13,<2",
    "ollama>=0.6",
    "httpx>=0.27",  # imported directly by brain/ollama_brain.py (ollama's own transport)
    "pydantic>=2.10",
    "pyyaml>=6",
    "numpy>=2.2",
    "tinytuya>=1.17",
    "broadlink>=0.19",
    "wakeonlan>=3",
    "edge-tts>=7.3.1",  # Microsoft refuses older releases (HTTP 403) since its Oct 2026 token change
    "soundfile>=0.13",
    "sounddevice>=0.5",
    "genshin>=1.7.31,<2",  # unofficial HoYoLAB client: game status and daily check-in
]

[project.optional-dependencies]
# torch/torchaudio must be installed first from the CUDA index (see README).
voice = [
    "faster-whisper>=1.2",
    "speechbrain>=1.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
waifu = "waifu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waifu = ["avatar/web/*", "avatar/web/**/*", "voice/*.ps1", "japanese_words.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
