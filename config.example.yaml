# Salin file ini menjadi config.yaml lalu sesuaikan.
# config.yaml tidak di-commit karena berisi local key perangkat.

assistant:
  name: Cyrene
  # Kata panggilan, boleh di mana saja dalam kalimat: "Cyrene, nyalakan lampu".
  # Variasi ejaan membantu kalau Whisper menulis namanya berbeda. Hindari kata sehari-hari
  # seperti "sirene": dia akan terpanggil setiap kali kamu membicarakan sirene.
  wake_words: [cyrene, sairin, sairen, syrene, kyurene, キュレネ]
  # Setelah dia menjawab, kamu boleh lanjut bicara tanpa memanggil namanya selama N detik.
  followup_seconds: 8
  persona_file: config/persona.md
  # Obrolan dilupakan kalau tidak ada percakapan selama N menit.
  session_idle_minutes: 10
  max_session_turns: 40

audio:
  input_device: null    # null = mic default; atau nomor/nama dari `waifu mics`
  output_device: null
  sample_rate: 16000
  vad:
    threshold_db: -45   # suara di bawah ini dianggap hening
    margin_db: 12       # harus lebih keras N dB dari noise ruangan
    silence_ms: 700     # jeda selama ini = kalimat selesai
    max_speech_s: 15

speaker:
  enabled: true          # hanya merespons suara pemilik (jalankan `waifu enroll` dulu)
  voiceprint_path: data/voiceprint.npy
  threshold: 0.45        # kalibrasi dengan `waifu speaker-test`
  device: cuda

stt:
  model: large-v3-turbo
  device: cuda
  compute_type: float16
  languages: [id, ja]    # bahasa pertama dipakai kalau deteksi meleset

brain:
  backend: ollama        # ollama (lokal, gratis) | claude (butuh ANTHROPIC_API_KEY)
  max_tool_rounds: 5
  ollama:
    host: http://127.0.0.1:11434
    model: qwen3:8b
    think: false
    keep_alive: 30m
  claude:
    model: claude-opus-5-5
    effort: low          # low = paling cepat untuk percakapan suara
    max_tokens: 16000
    fallbacks: true

tts:
  default_language: id
  voices:
    id:
      engine: edge
      voice: id-ID-GadisNeural
      pitch: "+15Hz"
    ja:
      engine: edge
      voice: ja-JP-NanamiNeural
      pitch: "+10Hz"
    # Suara anime dari GPT-SoVITS (jalankan api_v2.py-nya dulu):
    # ja:
    #   engine: gpt_sovits
    #   url: http://127.0.0.1:9880
    #   ref_audio_path: D:/voices/cyrene_ref.wav
    #   prompt_text: "参照音声で話している日本語の文"
    #   prompt_lang: ja
  # Suara anime つくよみちゃん (README, bagian "Suara anime"): setiap jawaban, Indonesia dan
  # Jepang, diubah ke satu suara karakter oleh model RVC yang dijalankan Applio di PC ini.
  # Kalau server RVC gagal jalan, dia tetap bicara dengan suara di atas.
  rvc:
    enabled: false
    applio_dir: C:/AI/Applio   # Applio dengan env Python 3.12-nya sendiri (env/Scripts/python.exe)
    # python: C:/AI/Applio/env/Scripts/python.exe   # isi kalau Python Applio ada di tempat lain
    # Checkpoint hasil training, wajib diisi kalau enabled: true. Nama filenya
    # <nama>_<epoch>e_<step>s.pth, jadi angkanya mengikuti checkpoint yang kamu pilih.
    # model: C:/AI/Applio/logs/tsukuyomi/tsukuyomi_100e_4500s.pth
    # Opsional, dibuat saat training; path-nya tidak boleh mengandung "trained" (README).
    # index: C:/AI/Applio/logs/tsukuyomi/tsukuyomi.index
    pitch: 4            # semitone; diukur: edge-tts sekitar 275 Hz, korpus Tsukuyomi sekitar 351 Hz
    index_rate: 0.75    # 0-1: makin besar makin dekat ke warna suara korpus (butuh index)
    protect: 0.33       # 0-0.5: makin kecil makin melindungi konsonan dan napas; 0.5 = mati
    # Harus alamat IPv4 loopback: server RVC tanpa kata sandi hanya mendengarkan di PC
    # ini, dan "localhost" membuat setiap jawaban sekitar 2 detik lebih lambat.
    host: 127.0.0.1
    port: 9881
    startup_timeout_s: 180   # start pertama memuat model ke GPU dan bisa lama

# Avatar 3D つくよみちゃん (README, bagian "Avatar 3D"): maskot transparan di desktop yang
# bernapas, berkedip, menggerakkan mulut mengikuti suaranya, dan menunjukkan ekspresi jawaban.
# Kalau avatar gagal jalan (misalnya Electron belum dipasang), Cyrene tetap jalan tanpa avatar.
avatar:
  enabled: false
  # File VRM, wajib diisi kalau enabled: true. Hanya untuk pemakaian pribadi: jangan
  # di-commit, dibagikan, atau diunggah ke mana pun.
  # model: C:/AI/avatars/tsukuyomi_a.vrm
  window: mascot          # mascot: jendela transparan Electron | app: jendela Edge | none: tanpa jendela
  width: 360              # ukuran jendela dalam piksel
  height: 640
  corner: bottom-right    # posisi awal: bottom-right | bottom-left | top-right | top-left
  always_on_top: true     # selalu di atas jendela lain
  framing: full           # full: seluruh badan | upper: setengah badan
  # Harus alamat IPv4 loopback (127.x.x.x, biasanya 127.0.0.1): halaman avatar hanya bisa
  # dibuka dari PC ini.
  host: 127.0.0.1
  port: 9882

ir_codes_path: data/ir_codes.json

devices:
  - id: lampu_kamar
    name: Lampu kamar
    aliases: [lampu, lampu utama]
    type: tuya_light
    tuya:
      device_id: "isi_dari_tinytuya_wizard"
      local_key: "isi_dari_tinytuya_wizard"
      address: Auto
      version: 3.3

  - id: ac
    name: AC Samsung
    aliases: [ac, pendingin]
    type: ir
    ir:
      backend: broadlink   # broadlink | tuya
      host: 192.168.1.50
    # Tombol remote yang ingin dipelajari (`waifu learn-ir ac --missing`).
    commands: [on, off, temp_16, temp_17, temp_18, temp_19, temp_20, temp_21, temp_22,
               temp_23, temp_24, temp_25, temp_26, temp_27, temp_28, temp_29, temp_30]

  - id: proyektor
    name: Proyektor Wanbo Dali
    aliases: [proyektor, projector]
    type: ir
    ir:
      backend: broadlink
      host: 192.168.1.50
    commands: [power, volume_up, volume_down, home, back, ok]

  - id: komputer
    name: Komputer
    aliases: [pc, komputer]
    type: pc
    pc:
      local: true          # PC yang menjalankan waifu ini
      mac: null            # isi untuk Wake-on-LAN dari perangkat lain
      shutdown_delay_s: 30

  - id: colokan_pc
    name: Colokan PC
    type: tuya_plug
    tuya:
      device_id: "isi_dari_tinytuya_wizard"
      local_key: "isi_dari_tinytuya_wizard"
