# Salin file ini menjadi config.yaml lalu sesuaikan.
# config.yaml tidak di-commit karena berisi local key perangkat.

assistant:
  name: Cyrene
  # Panggilannya untukmu, misalnya Sayang: dipakai di persona ({owner}), pengingat, pertanyaan
  # konfirmasi, dan kalimat reaksi avatar. "iya, Sayang" tetap dihitung sebagai jawaban iya.
  owner_call: Master
  # Kata panggilan, boleh di mana saja dalam kalimat: "Cyrene, nyalakan lampu".
  # Variasi ejaan membantu kalau Whisper menulis namanya berbeda. Hindari kata sehari-hari
  # seperti "sirene": dia akan terpanggil setiap kali kamu membicarakan sirene.
  wake_words: [cyrene, sairin, sairen, syrene, kyurene, キュレネ]
  # Setelah dia menjawab, kamu boleh lanjut bicara tanpa memanggil namanya selama N detik.
  followup_seconds: 8
  persona_file: config/persona.md   # atau config/persona_hsr.md: lebih mirip Cyrene di Honkai: Star Rail
  # Obrolan dilupakan kalau tidak ada percakapan selama N menit.
  session_idle_minutes: 10
  max_session_turns: 40

audio:
  input_device: null    # null = mic default; atau nomor/nama dari `waifu mics`
  output_device: null
  sample_rate: 16000
  vad:
    threshold_db: -45   # suara di bawah ini dianggap hening
    margin_db: 12       # harus lebih keras N dB dari noise ruangan
    silence_ms: 700     # jeda selama ini = kalimat selesai
    max_speech_s: 15

speaker:
  enabled: true          # hanya merespons suara pemilik (jalankan `waifu enroll` dulu)
  voiceprint_path: data/voiceprint.npy
  threshold: 0.45        # kalibrasi dengan `waifu speaker-test`
  device: cuda

stt:
  model: large-v3-turbo
  device: cuda
  compute_type: float16
  languages: [id, ja]    # bahasa pertama dipakai kalau deteksi meleset

brain:
  backend: ollama        # ollama (lokal, gratis) | claude (butuh ANTHROPIC_API_KEY)
  max_tool_rounds: 5
  ollama:
    host: http://127.0.0.1:11434
    model: qwen3:8b
    think: false
    keep_alive: 30m
  claude:
    model: claude-opus-5-5
    effort: low          # low = paling cepat untuk percakapan suara
    max_tokens: 16000
    fallbacks: true

tts:
  default_language: id
  voices:
    id:
      engine: edge
      voice: id-ID-GadisNeural
      pitch: "+15Hz"
    ja:
      engine: edge
      voice: ja-JP-NanamiNeural
      pitch: "+10Hz"
    # Suara anime dari GPT-SoVITS (jalankan api_v2.py-nya dulu):
    # ja:
    #   engine: gpt_sovits
    #   url: http://127.0.0.1:9880
    #   ref_audio_path: D:/voices/cyrene_ref.wav
    #   prompt_text: "参照音声で話している日本語の文"
    #   prompt_lang: ja
  # Suara cadangan offline (README, bagian "Suara cadangan offline"): kalau edge-tts gagal
  # (tanpa internet, atau Microsoft menolaknya), bagian itu diucapkan suara bawaan Windows,
  # lalu edge-tts dicoba lagi setelah retry_s detik. Tambahkan suaranya gratis di Settings →
  # Time & language → Speech → Add voices (Indonesian, Japanese); 'waifu voices' menampilkan
  # suara yang sudah ada, 'waifu say --fallback Halo' memperdengarkannya.
  fallback:
    enabled: true
    voices:
      id: ""     # kosong = suara Indonesia yang terpasang (Microsoft Andika)
      ja: ""     # kosong = suara Jepang yang terpasang, perempuan lebih dulu (mis. Haruka)
    retry_s: 600
    # Semitone untuk suara anime (RVC) per jenis suara Windows; tts.rvc.pitch untuk edge-tts.
    # Diukur: suara perempuan sekitar 188 Hz, pria 95-165 Hz, korpus Tsukuyomi sekitar 351 Hz.
    rvc_pitch:
      female: 11
      male: 18
  # Suara anime つくよみちゃん (README, bagian "Suara anime"): setiap jawaban, Indonesia dan
  # Jepang, diubah ke satu suara karakter oleh model RVC yang dijalankan Applio di PC ini.
  # Kalau server RVC gagal jalan, dia tetap bicara dengan suara di atas.
  rvc:
    enabled: false
    applio_dir: C:/AI/Applio   # Applio dengan env Python 3.12-nya sendiri (env/Scripts/python.exe)
    # python: C:/AI/Applio/env/Scripts/python.exe   # isi kalau Python Applio ada di tempat lain
    # Checkpoint hasil training, wajib diisi kalau enabled: true. Nama filenya
    # <nama>_<epoch>e_<step>s.pth, jadi angkanya mengikuti checkpoint yang kamu pilih.
    # model: C:/AI/Applio/logs/tsukuyomi/tsukuyomi_100e_4500s.pth
    # Opsional, dibuat saat training; path-nya tidak boleh mengandung "trained" (README).
    # index: C:/AI/Applio/logs/tsukuyomi/tsukuyomi.index
    pitch: 4            # semitone; diukur: edge-tts sekitar 275 Hz, korpus Tsukuyomi sekitar 351 Hz
    index_rate: 0.75    # 0-1: makin besar makin dekat ke warna suara korpus (butuh index)
    protect: 0.33       # 0-0.5: makin kecil makin melindungi konsonan dan napas; 0.5 = mati
    # Harus alamat IPv4 loopback: server RVC tanpa kata sandi hanya mendengarkan di PC
    # ini, dan "localhost" membuat setiap jawaban sekitar 2 detik lebih lambat.
    host: 127.0.0.1
    port: 9881
    startup_timeout_s: 180   # start pertama memuat model ke GPU dan bisa lama

# Avatar (README, bagian "Avatar 3D" dan "Avatar Live2D & interaksi"): maskot transparan di
# desktop yang bernapas, berkedip, menggerakkan mulut mengikuti suaranya, menunjukkan ekspresi
# jawaban, menatap kursor, dan bereaksi saat kepalanya dielus atau badannya dicolek.
# Kalau avatar gagal jalan (misalnya Electron belum dipasang), Cyrene tetap jalan tanpa avatar.
avatar:
  enabled: false
  engine: vrm             # vrm: model 3D .vrm | live2d: model Live2D Cubism (.model3.json)
  # File model, wajib diisi kalau enabled: true: .vrm untuk engine vrm, .model3.json untuk
  # engine live2d. Hanya untuk pemakaian pribadi: jangan di-commit, dibagikan, atau diunggah
  # ke mana pun.
  # model: C:/AI/avatars/tsukuyomi_a.vrm
  #
  # Live2D (engine: live2d): taruh seluruh folder model di C:/AI/avatars/ (model3.json
  # memanggil moc3, tekstur, dan physics dari foldernya sendiri), lalu isi live2d_core dengan
  # live2dcubismcore.min.js dari Cubism SDK for Web yang kamu unduh sendiri dari situs resmi
  # Live2D. Core itu milik Live2D: simpan di luar folder proyek, jangan pernah disalin ke repo.
  # engine: live2d
  # model: C:/AI/avatars/cyrene-live2d/Cyrene.model3.json
  # live2d_core: C:/AI/avatars/live2d/live2dcubismcore.min.js
  #
  # Kredit kecil yang selalu tampil di pojok halaman avatar; sesuaikan dengan modelnya.
  credit: "つくよみちゃん（© Rei Yumesaki）"
  # credit: "Cyrene © miHoYo · Live2D: MomokaSono"   # untuk model Live2D Cyrene di atas
  # Reaksi terhadap mouse, untuk kedua engine (README, bagian "Avatar Live2D & interaksi").
  # Hanya ada dua area: kepala (dielus) dan badan (dicolek).
  interactions:
    enabled: true             # false: semua reaksi mati; maskot tetap bisa digeser
    cursor_follow: true       # matanya dan kepalanya mengikuti kursor mouse
    head_pat: true            # klik atau usap kepalanya: dia senang dielus
    body_touch: true          # klik badannya: dia kaget dicolek
    double_click_listen: true # klik dua kali: dia langsung mendengarkan tanpa dipanggil namanya
    idle: true                # tampak bosan (menguap) setelah 3 menit tanpa aktivitas
    welcome_back_after_min: 10  # maskot saja: sapa Master saat mouse bergerak lagi setelah N menit diam (0 = tidak)
    reaction_cooldown_s: 3    # jeda minimal antar-reaksi bersuara, supaya klik beruntun tidak jadi spam
    # Kalimat tiap reaksi, dipilih acak dan tidak pernah sama dua kali berturut-turut.
    # Hapus satu jenis untuk memakai bawaannya; tiap jenis butuh minimal satu kalimat.
    # {owner} diganti dengan assistant.owner_call; kalimat yang memuatnya wajib diberi tanda kutip.
    lines:
      head_pat: ["えへへ, geli, {owner}!", "Hehe, makasih elusannya, {owner}.", "Mm, enak dielus begini."]
      body_touch: ["Hei! Kaget aku, {owner}.", "Eh? Ada apa, {owner}?", "Jangan iseng, ya!"]
      welcome_back: ["おかえりなさい, {owner}!", "{owner} sudah kembali! Aku kangen."]
      listen: ["はい, {owner}?", "Iya, aku dengar."]
  window: mascot          # mascot: jendela transparan Electron | app: jendela Edge | none: tanpa jendela
  width: 360              # ukuran jendela dalam piksel
  height: 640
  corner: bottom-right    # posisi awal: bottom-right | bottom-left | top-right | top-left
  always_on_top: true     # selalu di atas jendela lain
  framing: full           # full: seluruh badan | upper: setengah badan
  # Harus alamat IPv4 loopback (127.x.x.x, biasanya 127.0.0.1): halaman avatar hanya bisa
  # dibuka dari PC ini.
  host: 127.0.0.1
  port: 9882

# Teman main game HoYoverse (README, bagian "Teman main gacha"): status stamina dan daily,
# pengingat lewat suara dan HP, check-in harian HoYoLAB, dan riwayat pull (pity, 50/50).
gacha:
  enabled: false
  # Cookie login hoyolab.com: rahasia seperti kata sandi (config.yaml tidak di-commit).
  # Minimal ltuid_v2 dan ltoken_v2. Salin semuanya supaya cookie_token_v2 ikut: riwayat pull
  # tetap terbaca walau riwayat di game belum dibuka hari ini. Cara mengambilnya ada di README.
  # cookie: "ltuid_v2=...; ltoken_v2=...; ltmid_v2=...; cookie_token_v2=...; account_id_v2=...; account_mid_v2=..."
  games: [hsr, genshin, zzz]
  # uids: {hsr: 800000000}   # kosong = akun dengan level tertinggi tiap game di HoYoLAB itu
  server_utc_offset: 8       # server Asia (UTC+8): reset harian jam 04.00 waktu server
  poll_minutes: 15           # cek HoYoLAB tiap N menit selama `waifu run`
  checkin: true              # ambil hadiah check-in harian HoYoLAB otomatis
  reminders:
    stamina_minutes: 60      # ingatkan kalau stamina penuh dalam N menit (0 = saat sudah penuh)
    daily_time: "20:00"      # jam lokal; daily yang belum selesai diingatkan mulai jam ini
    weekly: true             # di hari terakhir sebelum reset mingguan
    expeditions: true        # saat semua ekspedisi selesai
  # Karakter 5★ tambahan yang berarti kalah 50/50, misalnya pilihan Celestial Invitation di HSR.
  # off_banner: {hsr: [Yunli]}
  data_dir: data/gacha

# Kode redeem (README, bagian "Kode redeem"): selama `waifu run` dan teman main gacha menyala,
# Cyrene membaca kode redeem baru untuk game di gacha.games dari hoyo-codes.seria.moe (API
# komunitas di balik Hoyo Buddy, yang mengecek kodenya ke HoYoLAB), lalu bilang sendiri dan
# mengirimnya ke HP kalau notify menyala: "Master, ada 2 kode HSR baru: ... Mau kutukarkan?".
# Kode hanya ditukarkan di akun HoYoLAB Master kalau Master minta ("iya, tukarkan", "pakai kode
# ABC123 di Genshin"), kecuali auto_redeem: true. Menukarkan butuh gacha.cookie yang memuat
# cookie_token_v2, account_id_v2, dan account_mid_v2; hadiahnya masuk ke surat dalam game.
# Lihat dan tukarkan dari terminal dengan `waifu gacha codes [game] [--redeem]`.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# redeem_codes:
#   enabled: true                         # false: tanpa tool dan tanpa pemberitahuan (`waifu gacha codes` tetap jalan)
#   poll_hours: 6                         # cek kode baru tiap N jam selama `waifu run` (1-48)
#   auto_redeem: false                    # true: kode baru langsung ditukarkan tanpa bertanya dulu
#   notices: true                         # false: tidak pernah bilang sendiri, kode tetap dicek (dan auto_redeem tidak jalan)
#   state_path: data/redeem_codes.json    # kode yang dikenal, hasil penukarannya, dan yang sudah diberitahukan, hanya di PC ini

# Laporan game mingguan (README, bagian "Laporan game mingguan"): selama `waifu run` dan teman
# main gacha menyala, sekali seminggu Cyrene bercerita sendiri tentang minggu Master di game
# yang ada di gacha.games: pull 7 hari terakhir dan 50/50-nya, pity tiap banner, progres
# endgame musim ini, dan endgame, banner, serta event yang berakhir dalam 7 hari. Itu hanya
# kabar: dia tidak pernah menyarankan pull atau top up. Teksnya juga dikirim ke HP kalau notify
# menyala. Kalau `waifu run` baru menyala sesudah jamnya, laporannya tetap datang sekali hari itu;
# hari yang terlewat seluruhnya tidak disusulkan. Lihat dari terminal dengan `waifu gacha report`.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# weekly_report:
#   enabled: true                         # false: tanpa tool dan tanpa laporan sendiri (`waifu gacha report` tetap jalan)
#   day: sunday                           # hari laporannya: monday, tuesday, wednesday, thursday, friday, saturday, atau sunday
#   time: "19:00"                         # mulai jam ini (jam PC) sampai tengah malam; 19.00 WIB = 20.00 server Asia
#   push: true                            # kirim laporannya juga ke HP (kalau notify menyala)
#   state_path: data/weekly_report.json   # hari laporan terakhir, supaya restart tidak mengulangnya

# Notifikasi ke HP lewat ntfy (aplikasi gratis, tanpa akun): langganan topik yang sama di aplikasinya.
notify:
  enabled: false
  server: https://ntfy.sh
  # Topik rahasia 16-64 huruf, angka, - atau _: siapa pun yang tahu namanya bisa membaca
  # notifikasinya. Buat dengan: python -c "import secrets; print('cyrene-' + secrets.token_urlsafe(12))"
  # topic: cyrene-isi-dengan-hasil-perintah-di-atas

# Keuangan dari tepira (README, bagian "Keuangan dari tepira"): "Cyrene, pengeluaran bulan ini
# berapa?", "sisa budget makan?", "saldo GoPay berapa?", "tabungan laptop sudah berapa?", atau
# "transaksi terakhir apa?" membuatnya membaca tepira (aplikasi keuanganmu) saat itu juga, lewat
# API khusus Cyrene di tepira yang hanya melayani pemiliknya. Hanya kalau Master bertanya: tidak
# pernah di sapaan pagi atau notifikasi HP. Dengan otak Claude angkanya ikut dikirim ke API
# Anthropic, dan jawabannya dibacakan lewat edge-tts; tidak ada yang disimpan ke disk. Dengan
# writes: true dan otak Claude, "catat jajan kopi 18 ribu" mencatat pengeluaran setelah Master
# menjawab iya, dan "batalkan yang tadi" menghapusnya lagi dalam 15 menit.
# Lihat dan uji dari terminal dengan `waifu tepira`.
tepira:
  enabled: false
  url: https://tepira.asepsunarya.com
  # Token API Cyrene: rahasia seperti kata sandi (config.yaml tidak di-commit). Buat dengan:
  # waifu tepira token, lalu pasang baris sha256-nya di Vercel (TEPIRA_CYRENE_TOKEN_SHA256).
  # token: tpcy_isi-dengan-hasil-waifu-tepira-token
  writes: false            # mencatat pengeluaran lewat suara (butuh TEPIRA_CYRENE_WRITES=1 di Vercel)
  # default_wallet: GoPay  # dompet untuk catatan yang tidak menyebut dompet; wajib kalau writes menyala

# Ingatan jangka panjang (README, bagian "Ingatan Cyrene"): catatan singkat tentang Master yang
# dia simpan saat diminta ("ingat ya, ...") atau sendiri, dan dibaca lagi di awal setiap sesi.
# Rahasia (kata sandi, PIN, OTP, token, cookie, nomor kartu) selalu ditolak.
# Lihat, tambah, dan hapus catatan dengan `waifu memory list|add|forget|clear`.
memory:
  enabled: true
  path: data/memory.json   # hanya di PC ini, tidak di-commit; boleh diedit saat Cyrene mati
  max_facts: 100           # jumlah catatan paling banyak (1-500)
  max_chars: 200           # panjang satu catatan paling banyak, dalam karakter (20-1000)

# Jadwal (README, bagian "Jadwal, pengingat, dan rutinitas"): pengingat ("ingatkan aku jam 3
# sore minum obat") dan perintah perangkat atau rutinitas pada jam tertentu, sekali atau
# berulang. Semuanya hanya jalan selama `waifu run` menyala; PC sendiri tidak pernah dijadwalkan.
# Lihat dan batalkan dengan `waifu schedule list|cancel|clear`. Dengan --dry-run jadwalnya
# sementara (hilang saat ditutup) dan file di `path` tidak disentuh.
schedule:
  enabled: true
  path: data/schedule.json # hanya di PC ini, tidak di-commit; boleh diedit saat Cyrene mati
  max_entries: 50          # jumlah jadwal paling banyak (1-200)
  late_grace_minutes: 30   # jadwal yang terlewat (PC atau Cyrene mati) masih jalan kalau telat paling lama N menit (0-720)

# Rutinitas: daftar perintah perangkat yang dijalankan sekaligus, lewat suara ("Cyrene, mode
# tidur"), terjadwal ("jalankan mode tidur jam 11 malam"), atau `waifu routine run tidur`.
# Hanya kamu yang menulisnya di sini. Nama rutinitas: huruf kecil, angka, atau garis bawah;
# 1-20 langkah. Perangkatnya harus ada di `devices` di bawah, dan PC (type: pc) tidak boleh
# jadi langkah: mematikan, me-restart, atau menidurkan PC hanya lewat perintah suara langsung.
# Colokan yang mengalirkan listrik ke PC (powers_pc: true, misalnya colokan_pc) juga ditolak.
# `waifu check` memeriksa apakah setiap perintahnya ada (untuk IR: sudah dipelajari).
# routines:
#   tidur:
#     description: Mode tidur
#     steps:
#       - {device: lampu_kamar, command: off}
#       - {device: ac, command: temp, value: 26}

# Daftar tugas (README, bagian "Daftar tugas"): hal yang perlu dikerjakan tanpa jam tertentu,
# dengan tenggat kalau ada ("Cyrene, tambah tugas: beli susu", "catat tugas kerjakan laporan,
# tenggatnya Jumat"). "Tugasku apa aja?" menyebut yang terlambat dan yang tenggatnya paling dekat
# dulu, dan sapaan pagi ikut menyebut tugas yang tenggatnya hari ini atau sudah lewat. Pengingat
# pada jam tertentu tetap lewat jadwal (bagian schedule di atas). Rahasia (kata sandi, PIN, OTP,
# token, nomor kartu) selalu ditolak. Lihat dan ubah dengan `waifu todo [add|done|remove|list]`.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# todo:
#   enabled: true          # false: tanpa tool dan tanpa tugas di sapaan pagi (`waifu todo` tetap jalan)
#   path: data/todo.json   # hanya di PC ini, tidak di-commit; boleh diedit saat Cyrene mati
#   max_tasks: 100         # jumlah tugas yang belum selesai paling banyak (1-500)
#   max_chars: 200         # panjang satu tugas paling banyak, dalam karakter (20-1000)
#   keep_done_days: 7      # tugas yang selesai masih ditampilkan N hari, lalu dilupakan (0-90)

# Lagu di YouTube (README, bagian "Lagu di YouTube"): "Cyrene, putar lagu Hope Is the Thing With
# Feathers", "puterin playlist lofi buat belajar", atau "play Hoyo-Mix" membuka halaman lagunya di
# browser default, tempat lagunya diputar. Dengan otak Claude dan pencarian web, dia mencari link
# YouTube lagunya dulu (satu pencarian web: 1 sen dolar ditambah token hasil pencarian, biasanya
# beberapa sen, tercatat di `waifu usage`); dengan Ollama atau pencarian web mati, atau kalau
# linknya tidak ketemu, yang dibuka halaman pencarian YouTube dan Master memilih sendiri. Halaman
# hanya dibuka kalau kalimat Master sendiri meminta memutar lagu (bukan mencari atau menanyakan
# sesuatu, menjeda, atau pindah lagu), dan hanya alamat YouTube. Membuka browser mengambil
# fokus dari game yang sedang dimainkan. Jeda, lagu berikutnya, dan volume lewat perangkat musik
# (type: media, di bagian devices di bawah). Dari terminal: `waifu youtube <link atau judul lagu>`.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# music:
#   enabled: true      # false: tanpa tool lagu (`waifu youtube` tetap jalan)
#   service: youtube   # youtube | youtube_music: lagu dan pencariannya dibuka di YouTube Music

# Melihat layar (README, bagian "Melihat layar"): dengan otak Claude, Cyrene mengambil satu
# tangkapan layar monitor utama hanya kalau kalimat Master sendiri memintanya ("Cyrene, lihat
# layarku"), lalu menjawab tentang isinya. Gambarnya ikut dikirim ke API Anthropic bersama
# percakapan dan tidak pernah disimpan ke disk atau ditulis ke log (juga dengan -v). Dengan
# Ollama fitur ini tidak tersedia. API menerima paling besar 5 MB per gambar, dan max_side
# tidak menjaminnya: di atas sekitar 1450, layar game yang sangat ramai otomatis diambil
# sekali lagi dengan ukuran lebih kecil.
# Sudah menyala tanpa ditulis; untuk mematikannya, tulis bagian ini tanpa tanda # di depannya
# lalu ganti enabled menjadi false.
# vision:
#   enabled: true
#   max_side: 1280   # sisi terpanjang tangkapan layar dalam piksel (512-1568); tidak pernah diperbesar

# Pencarian web (README, bagian "Pencarian web dan promo gratis"): dengan otak Claude, "Cyrene,
# cari berita terbaru soal ...", "harga RTX 5070 sekarang berapa?", atau "kapan HSR 4.7 rilis?"
# membuatnya mencari di web lalu menjawab dalam satu-dua kalimat dan menyebut sumbernya.
# Pencariannya berjalan di server Anthropic dengan kata kunci yang ditulis modelnya saja, ditambah
# negara, zona waktu, dan kota di bawah. Biayanya 10 dolar per 1000 pencarian di luar token (lihat
# usage.web_search_per_1000_usd). Dengan Ollama fitur ini tidak tersedia.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# web_search:
#   enabled: true
#   max_uses: 3              # pencarian paling banyak per permintaan ke Claude; satu pertanyaan bisa beberapa permintaan (1-10)
#   country: ID              # negara hasil pencarian, dua huruf besar
#   timezone: Asia/Jakarta   # zona waktu IANA
#   # city: Bandung          # kota untuk hasil lokal; tanpa ini briefing.city

# Sapaan pagi dan ringkasan harian (README, bagian "Sapaan pagi dan ringkasan harian"): sekali
# sehari, saat `waifu run` menyala pertama kali di antara `time` dan `until`, Cyrene menyapa
# Master sendiri dan merangkum harinya dalam beberapa kalimat: cuaca, jadwal dan pengingat hari
# ini, game kalau teman main gacha menyala, dan hal dari ingatannya yang penting hari ini.
# Kapan saja, "Cyrene, cuaca hari ini gimana?" memakai data yang sama. Cuaca dari Open-Meteo
# (gratis, tanpa akun atau key, butuh internet); cek dengan `waifu briefing`.
# Sudah menyala tanpa ditulis, tapi tanpa cuaca: tulis bagian ini tanpa tanda # di depannya,
# lalu ganti city dengan kotamu (atau enabled: false untuk mematikan sapaan dan ringkasannya).
# briefing:
#   enabled: true
#   time: "07:00"     # sapaan paling cepat jam ini (jam PC)
#   until: "12:00"    # dan sebelum jam ini; PC yang baru menyala sesudahnya tidak menyapa hari itu
#   city: Bandung     # kota untuk cuaca, dicari di Open-Meteo
#   # Atau koordinat persis (isi keduanya; menang atas city, yang tetap jadi nama tempat yang
#   # dia sebut), misalnya dari Google Maps:
#   # latitude: -6.9175
#   # longitude: 107.6191
#   push: true        # kirim sapaannya juga ke HP (kalau notify menyala)
#   state_path: data/briefing.json   # hari sapaan terakhir, supaya restart tidak menyapa lagi

# Peringatan hujan (README, bagian "Peringatan hujan"): selama `waifu run` menyala, Cyrene
# memperingatkan sendiri sebelum hujan, misalnya "Master, sekitar jam tiga sore kemungkinan
# hujan di Bandung, angkat jemuran ya." Tempatnya dari bagian briefing di atas (isi
# briefing.city dulu; tanpa tempat peringatan ini diam), prakiraannya dari Open-Meteo yang
# dibaca tiap 15 menit hanya di jam aktif, dan satu hujan hanya diperingatkan sekali. Kalau
# kamu sedang ngobrol dengannya, dia menunggu sampai obrolannya selesai. Cek dengan `waifu rain`.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya
# (atau enabled: false untuk mematikannya).
# rain_alert:
#   enabled: true
#   lead_minutes: 60       # beri tahu sekian menit sebelum hujan mulai (30-180); prakiraannya per jam
#   threshold: 60          # peluang hujan per jam (%) yang dihitung sebagai hujan (30-100)
#   active_from: "06:00"   # hanya mulai jam ini (jam PC)
#   active_until: "21:00"  # dan sebelum jam ini; malam hari dia diam
#   push: true             # kirim peringatannya juga ke HP (kalau notify menyala)

# Kabar versi baru (README, bagian "Versi baru"): `waifu run` yang menyala berhari-hari tetap
# menjalankan kode saat dia dimulai. Selama itu Cyrene membandingkannya dengan kode di folder ini,
# dan sekali untuk setiap versi baru di CHANGELOG.md dia bilang, misalnya "Master, ada versi baru
# Cyrene: v1.26, versi baru. Mulai ulang aku kalau sempat ya." Kalau paket Python-nya berubah, dia
# minta pip install dulu dan perintahnya dikirim ke HP. Dia tidak pernah memulai ulang dirinya
# sendiri. Cek dengan `waifu version` atau `waifu check`.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya
# (atau enabled: false untuk mematikannya).
# version_notice:
#   enabled: true
#   check_minutes: 30      # bandingkan dengan kode di disk setiap sekian menit (5-1440)
#   active_from: "08:00"   # hanya mulai jam ini (jam PC)
#   active_until: "22:00"  # dan sebelum jam ini; malam hari dia diam
#   push: true             # kirim kabarnya juga ke HP (kalau notify menyala)

# Biaya API Claude (README, bagian "Biaya API Claude"): dengan otak Claude, Cyrene mencatat token
# setiap jawabannya dan menghitung biayanya dari harga per model. Tanyakan "Cyrene, biaya API
# bulan ini berapa?" atau lihat `waifu usage`. Ini perkiraan dari catatannya sendiri, bukan
# tagihan di Anthropic Console: aplikasi lain yang memakai API key yang sama tidak terhitung.
# Dengan Ollama tidak ada yang dicatat (gratis).
# Sudah menyala tanpa ditulis; untuk anggaran bulanan, kurs rupiah, atau harga sendiri, tulis
# bagian ini tanpa tanda # di depannya (atau enabled: false untuk berhenti mencatat).
# usage:
#   enabled: true
#   path: data/usage.json      # hanya di PC ini, tidak di-commit
#   monthly_budget_usd: 20     # dia memberi tahu sekali di 80% dan sekali di 100% tiap bulan, tanpa berhenti
#   idr_per_usd: 16300         # kurs rupiah per dolar, untuk ikut menyebut biayanya dalam rupiah; perbarui sendiri
#   # Harga dalam dolar per sejuta token, menimpa atau menambah harga bawaan. Tulis di sini
#   # kalau harga resmi berubah, atau harga model lain kalau brain.claude.model kamu ganti.
#   prices:
#     claude-opus-5-5: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
#   default_model: claude-opus-5-5   # harga model ini dipakai untuk model yang tidak ada di prices (perkiraan); harus punya harga
#   web_search_per_1000_usd: 10      # pencarian web Claude (di obrolan dan pencarian promo AI), dolar per 1000 pencarian, di luar token

# Kesehatan PC (README, bagian "Kesehatan PC"): "Cyrene, PC-ku gimana?", "GPU-ku panas nggak?",
# atau "disk C sisa berapa?" membuatnya membaca PC saat itu juga: beban CPU, RAM, sisa tiap
# disk tetap, suhu, beban, VRAM, dan daya GPU NVIDIA (lewat nvidia-smi), dan sudah berapa lama
# sejak Windows terakhir di-restart (sleep dan shutdown dengan Fast Startup tidak mengulangnya).
# Selama `waifu run` dia juga bilang sendiri (dan mengirimnya ke HP kalau notify menyala) saat
# sebuah disk hampir penuh atau GPU terus panas. Suhu CPU tidak bisa dibaca.
# Lihat angkanya dengan `waifu pc`. Hanya angka, huruf drive, dan nama model GPU; tidak ada
# nama program atau file, dan tidak ada yang disimpan ke disk.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# pc_health:
#   enabled: true          # false: tanpa tool dan tanpa pemberitahuan (`waifu pc` tetap jalan)
#   notices: true          # false: hanya menjawab kalau ditanya, tidak pernah bilang sendiri
#   poll_seconds: 60       # baca PC tiap N detik selama `waifu run` (15-3600)
#   disk_warn_gb: 10       # sisa disk di bawah N GB: diberi tahu sekali per disk per hari (1-2000)
#   gpu_warn_c: 85         # GPU di N °C atau lebih (60-100) ...
#   gpu_warn_minutes: 3    # ... selama N menit berturut-turut: diberi tahu paling sering sekali per jam (1-60)

# Jam main (README, bagian "Jam main"): selama `waifu run` dia mencatat berapa lama HSR, Genshin,
# dan ZZZ terbuka, dari nama program di daftar proses Windows saja (tidak pernah membuka atau
# menyentuh proses game, yang memakai anti-cheat). "Hari ini aku main berapa lama?" atau
# "minggu ini Genshin berapa jam?" dijawab dari catatannya; laporan game mingguan ikut
# menyebutnya. Yang dihitung adalah waktu game terbuka (diminimalkan atau ditinggal pun ikut),
# dan hanya selama `waifu run` menyala. Lihat angkanya dengan `waifu playtime`.
# Hanya nama tiga game dan jamnya, disimpan di PC ini (path), tanpa pemberitahuan HP sendiri; tapi
# kalimat laporan mingguan yang menyebut jam main ke ntfy.sh kalau notify dan weekly_report.push
# menyala. Dengan Claude totalnya ikut ke API Anthropic hanya saat ditanya dan di laporan mingguan.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# play_time:
#   enabled: true          # false: tidak mencatat dan tanpa tool (`waifu playtime` tetap membaca catatan lama)
#   poll_seconds: 60       # lihat daftar proses tiap N detik selama `waifu run` (15-600)
#   games:                 # nama program tiap game, seperti di Task Manager > Details; hanya yang ditulis yang dihitung
#     hsr: [StarRail.exe]
#     genshin: [GenshinImpact.exe, YuanShen.exe]
#     zzz: [ZenlessZoneZero.exe]
#   bedtime:               # misalnya 23:30: lewat jam itu, kalau game masih terbuka, dia mengingatkan sekali semalam (18:00-05:59; kosong = mati)
#   keep_days: 90          # catatan lebih lama dari N hari dihapus (1-366)
#   path: data/playtime.json

# Teman fokus (README, bagian "Teman fokus"): selama `waifu run`, "temani aku fokus 25 menit" atau
# "pomodoro empat kali" membuatnya menjaga waktu fokus dan istirahat (blok 5-120 menit, istirahat
# 1-60 menit, sampai 8 kali; panjangnya diminta lewat suara). Selama blok fokus dia diam:
# pemberitahuannya sendiri (hujan, game, PC, promo, biaya, versi baru) dan sapaan pagi menunggu
# istirahat, tapi pengingat dan jadwal yang Master pasang tetap berbunyi. "Sisa berapa menit?" dan
# "berhenti fokusnya" juga bisa. Sesinya hilang kalau `waifu run` dimulai ulang. Lihat waktu fokus
# hari ini dan minggu ini dengan `waifu focus`. Yang disimpan hanya kapan tiap blok fokus mulai
# dan selesai, di PC ini (path); dengan Claude, waktunya ikut ke API Anthropic saat ditanya.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# focus:
#   enabled: true          # false: tanpa timer fokus (`waifu focus` tetap membaca catatan lama)
#   push: false            # true: kalimat akhir blok, istirahat, dan sesi juga dikirim ke HP (butuh notify)
#   keep_days: 90          # catatan lebih lama dari N hari dihapus (1-366)
#   path: data/focus.json

# Jurnal harian (README, bagian "Jurnal harian"): "Cyrene, catat di jurnal: hari ini laporannya
# selesai" menyimpan catatan hari itu dengan kata-kata Master sendiri, dan "kemarin aku nulis apa
# di jurnal?" dia rangkum singkat. Hanya kalau Master minta: tidak pernah di sapaan pagi, laporan
# mingguan, atau ke HP. Dengan ask_at, sekali sehari mulai jam itu sampai tengah malam dia bertanya
# bagaimana hari Master, dan jawaban Master (langsung sesudah pertanyaannya, tanpa memanggil
# namanya) dicatat. Menghapus hanya lewat `waifu jurnal forget <tanggal> --yes`, tidak lewat
# suara. Catatannya disimpan di PC ini (path) sampai dihapus; rahasia (kata sandi, PIN, OTP,
# token, nomor kartu) selalu ditolak. Dengan Claude, catatan yang ditulis atau dibaca ikut ke API
# Anthropic. Lihat dan ubah dengan `waifu jurnal [list|show|add|forget]`.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# journal:
#   enabled: true          # false: tanpa tool dan tanpa pertanyaan malam (`waifu jurnal` tetap jalan)
#   path: data/journal.json  # hanya di PC ini, tidak di-commit; boleh diedit saat Cyrene mati
#   max_chars: 500         # panjang satu catatan paling banyak, dalam karakter (20-2000)
#   max_notes_per_day: 20  # catatan sehari paling banyak (1-100)
#   ask_at:                # misalnya 21:30: sekali sehari mulai jam itu dia bertanya bagaimana hari Master (12:00-23:59; kosong = mati)
#   state_path: data/journal_question.json  # hari terakhir dia bertanya

# Promo gratis (README, bagian "Pencarian web dan promo gratis"): "Ada game gratis apa sekarang?"
# membuatnya membaca game yang gratis untuk disimpan di Epic Games Store (dari Epic sendiri) dan
# di Steam, GOG, dan lainnya (dari GamerPower.com). "Ada promo AI gratis nggak?" membacakan promo
# dari penyedia AI ternama (Anthropic, OpenAI, Google, dan lainnya): kredit gratis, paket gratis,
# uji coba, dan program startup atau pelajar, yang bisa langsung diklaim atau perlu mendaftar.
# Promo AI dicari seminggu sekali oleh Claude dengan pencarian web: berbayar, paling banyak
# ai_max_searches pencarian web per permintaan ditambah token, jadi satu pencarian promo bisa sampai
# beberapa puluh sen dolar (`waifu offers ai --scan` menampilkan perkiraannya), juga dengan otak
# Ollama (butuh API key Claude; tanpa itu tulis ai: false).
# Selama `waifu run` dia bilang sendiri saat ada game gratis baru atau promo AI baru, dan
# mengirimnya ke HP dengan linknya kalau notify menyala; "kirim linknya ke HP" mengirim link satu
# promo. Dia tidak pernah mengklaim, mendaftar, login, atau membeli apa pun.
# Lihat semuanya dengan `waifu offers`.
# Sudah menyala tanpa ditulis; untuk mengubahnya, tulis bagian ini tanpa tanda # di depannya.
# free_offers:
#   enabled: true                       # false: tanpa tool dan tanpa pemberitahuan (`waifu offers` tetap jalan)
#   games: true                         # false: tanpa game gratis
#   game_platforms: [epic, steam, gog]  # dari epic, steam, gog, itchio, pc (semua toko PC)
#   games_poll_hours: 6                 # cek game gratis tiap N jam selama `waifu run` (1-48)
#   ai: true                            # false: tanpa pencarian promo AI
#   ai_scan_days: 7                     # cari promo AI tiap N hari (1-30)
#   ai_max_searches: 10                 # pencarian web paling banyak per permintaan ke Claude dalam pencarian promo AI (1-20)
#   notices: true                       # false: tidak pernah bilang sendiri, dan pencarian promo AI mingguan juga berhenti (jalankan 'waifu offers ai --scan' sendiri)
#   state_path: data/free_offers.json   # game yang sudah diberitahukan dan promo AI yang ditemukan, hanya di PC ini

# Cyrene di HP (README, bagian "Cyrene di HP"): selama `waifu run` berjalan, HP Android Master
# membuka halaman Cyrene (avatar, chat, dan tombol tahan-untuk-bicara) lewat Tailscale, di
# rumah atau di luar. Server HP hanya mendengarkan di 127.0.0.1; `tailscale serve` yang
# membagikannya lewat HTTPS, hanya ke perangkat di jaringan Tailscale-mu (jangan pakai
# `tailscale funnel` untuk alamat ini: server HP menolak permintaan dari internet), dan hanya HP
# yang sudah dipasangkan dengan kode dari `waifu phone pair` yang dilayani. Cara menyiapkannya:
# pasang Tailscale di PC dan HP (akun yang sama), nyalakan MagicDNS dan HTTPS Certificates di
# admin console Tailscale, jalankan `waifu phone setup` dan sekali perintah `tailscale serve`
# yang ditampilkannya, lalu tulis bagian ini tanpa tanda # di depannya. Avatarnya memakai
# model di bagian avatar di atas (avatar.engine, avatar.model, avatar.live2d_core), juga kalau
# avatar.enabled: false. Kamera HP (README, bagian "Kamera HP"): selama jendela kamera di
# halaman terbuka, setiap pesan membawa satu foto saat itu, yang ikut dikirim ke API Anthropic
# dan tidak pernah disimpan atau ditulis ke log. Hanya dengan otak Claude dan vision menyala;
# sisi terpanjang fotonya vision.max_side. Cek dengan `waifu check`.
# phone:
#   enabled: true
#   host: nama-pc.tailnet-kamu.ts.net   # nama PC ini di Tailscale, dari `waifu phone setup`
#   port: 9883                          # server HP di 127.0.0.1; sama dengan port di perintah `tailscale serve`
#   state_path: data/phone.json         # HP yang dipasangkan (token tersimpan sebagai hash), hanya di PC ini
#   camera: true                        # tombol kamera di halaman HP; false menyembunyikannya dan server menolak foto

ir_codes_path: data/ir_codes.json

devices:
  - id: lampu_kamar
    name: Lampu kamar
    aliases: [lampu, lampu utama]
    type: tuya_light
    tuya:
      device_id: "isi_dari_tinytuya_wizard"
      local_key: "isi_dari_tinytuya_wizard"
      address: Auto
      version: 3.3

  - id: ac
    name: AC Samsung
    aliases: [ac, pendingin]
    type: ir
    ir:
      backend: broadlink   # broadlink | tuya
      host: 192.168.1.50
    # Tombol remote yang ingin dipelajari (`waifu learn-ir ac --missing`).
    commands: [on, off, temp_16, temp_17, temp_18, temp_19, temp_20, temp_21, temp_22,
               temp_23, temp_24, temp_25, temp_26, temp_27, temp_28, temp_29, temp_30]

  - id: proyektor
    name: Proyektor Wanbo Dali
    aliases: [proyektor, projector]
    type: ir
    ir:
      backend: broadlink
      host: 192.168.1.50
    commands: [power, volume_up, volume_down, home, back, ok]

  - id: komputer
    name: Komputer
    aliases: [pc, komputer]
    type: pc
    pc:
      local: true          # PC yang menjalankan waifu ini
      mac: null            # isi untuk Wake-on-LAN dari perangkat lain
      shutdown_delay_s: 30

  # Colokan yang mengalirkan listrik ke PC (README, "Colokan pintar + BIOS"). powers_pc: true
  # membuatnya dijaga seperti PC: tidak pernah dijadwalkan atau jadi langkah rutinitas, dan
  # Cyrene minta konfirmasi dulu sebelum mematikannya (mematikannya = mencabut kabel PC).
  - id: colokan_pc
    name: Colokan PC
    type: tuya_plug
    powers_pc: true
    tuya:
      device_id: "isi_dari_tinytuya_wizard"
      local_key: "isi_dari_tinytuya_wizard"

  # Musik dan volume PC (README, bagian "Musik, volume, dan aplikasi PC"): tombol media dan
  # volume Windows, jadi berlaku untuk pemutar apa pun yang sedang terbuka (Spotify, YouTube
  # di browser, game), kecuali saat game yang berjalan sebagai administrator sedang aktif.
  # Perintah: play_pause, next, previous, stop, mute, volume_up dan volume_down (persen 1-100;
  # tanpa angka sekitar 10%), volume (0-100). Di rutinitas pakai stop, bukan play_pause:
  # play_pause malah memutar musik kalau tadi sedang berhenti (jadwal menolaknya). Kecilkan
  # suara dengan volume angka kecil: volume 0 juga membuat suara Cyrene tidak terdengar.
  # Misalnya langkah rutinitas tidur:
  # {device: musik, command: stop} lalu {device: musik, command: volume, value: 20}.
  # - id: musik
  #   name: Musik PC
  #   aliases: [musik, lagu, media, volume, suara]
  #   type: media

  # Aplikasi dan game di PC ini: Cyrene hanya membuka yang ada di daftar ini ("Cyrene, buka
  # Spotify" menjalankan open_spotify) dan tidak pernah menutup apa pun. Nama: huruf kecil,
  # angka, atau garis bawah; 1-30 aplikasi. Isinya path lengkap ke program (.exe), shortcut
  # (.lnk), atau shortcut internet (.url), atau URL launcher steam:// atau
  # com.epicgames.launcher://. Shortcut membuka apa pun yang ditunjuknya, jadi daftarkan hanya
  # shortcut yang kamu percayai. Ganti <nama> dengan nama user Windows-mu; nama folder dan file
  # shortcut di PC-mu bisa berbeda (cara mencarinya, juga App ID game Steam, ada di README).
  # `waifu check` menandai dengan ✗ file yang tidak ditemukan, dan shortcut .url yang tidak
  # membuka steam:// atau com.epicgames.launcher://.
  # - id: aplikasi
  #   name: Aplikasi PC
  #   aliases: [aplikasi, game]
  #   type: apps
  #   apps:
  #     spotify: "C:/Users/<nama>/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Spotify.lnk"
  #     genshin: "C:/Users/<nama>/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Genshin Impact.lnk"
  #     cyberpunk: "steam://rungameid/1091500"   # 1091500 = App ID Cyberpunk 2077 di Steam
