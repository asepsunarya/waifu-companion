# Salin file ini menjadi config.yaml lalu sesuaikan.
# config.yaml tidak di-commit karena berisi local key perangkat.

assistant:
  name: Cyrene
  # Kata panggilan, boleh di mana saja dalam kalimat: "Cyrene, nyalakan lampu".
  # Variasi ejaan membantu kalau Whisper menulis namanya berbeda. Hindari kata sehari-hari
  # seperti "sirene": dia akan terpanggil setiap kali kamu membicarakan sirene.
  wake_words: [cyrene, sairin, sairen, syrene, kyurene, キュレネ]
  # Setelah dia menjawab, kamu boleh lanjut bicara tanpa memanggil namanya selama N detik.
  followup_seconds: 8
  persona_file: config/persona.md
  # Obrolan dilupakan kalau tidak ada percakapan selama N menit.
  session_idle_minutes: 10
  max_session_turns: 40

audio:
  input_device: null    # null = mic default; atau nomor/nama dari `waifu mics`
  output_device: null
  sample_rate: 16000
  vad:
    threshold_db: -45   # suara di bawah ini dianggap hening
    margin_db: 12       # harus lebih keras N dB dari noise ruangan
    silence_ms: 700     # jeda selama ini = kalimat selesai
    max_speech_s: 15

speaker:
  enabled: true          # hanya merespons suara pemilik (jalankan `waifu enroll` dulu)
  voiceprint_path: data/voiceprint.npy
  threshold: 0.45        # kalibrasi dengan `waifu speaker-test`
  device: cuda

stt:
  model: large-v3-turbo
  device: cuda
  compute_type: float16
  languages: [id, ja]    # bahasa pertama dipakai kalau deteksi meleset

brain:
  backend: ollama        # ollama (lokal, gratis) | claude (butuh ANTHROPIC_API_KEY)
  max_tool_rounds: 5
  ollama:
    host: http://127.0.0.1:11434
    model: qwen3:8b
    think: false
    keep_alive: 30m
  claude:
    model: claude-opus-5-5
    effort: low          # low = paling cepat untuk percakapan suara
    max_tokens: 16000
    fallbacks: true

tts:
  default_language: id
  voices:
    id:
      engine: edge
      voice: id-ID-GadisNeural
      pitch: "+15Hz"
    ja:
      engine: edge
      voice: ja-JP-NanamiNeural
      pitch: "+10Hz"
    # Suara anime dari GPT-SoVITS (jalankan api_v2.py-nya dulu):
    # ja:
    #   engine: gpt_sovits
    #   url: http://127.0.0.1:9880
    #   ref_audio_path: D:/voices/cyrene_ref.wav
    #   prompt_text: "参照音声で話している日本語の文"
    #   prompt_lang: ja
  # Suara anime つくよみちゃん (README, bagian "Suara anime"): setiap jawaban, Indonesia dan
  # Jepang, diubah ke satu suara karakter oleh model RVC yang dijalankan Applio di PC ini.
  # Kalau server RVC gagal jalan, dia tetap bicara dengan suara di atas.
  rvc:
    enabled: false
    applio_dir: C:/AI/Applio   # Applio dengan env Python 3.12-nya sendiri (env/Scripts/python.exe)
    # python: C:/AI/Applio/env/Scripts/python.exe   # isi kalau Python Applio ada di tempat lain
    # Checkpoint hasil training, wajib diisi kalau enabled: true. Nama filenya
    # <nama>_<epoch>e_<step>s.pth, jadi angkanya mengikuti checkpoint yang kamu pilih.
    # model: C:/AI/Applio/logs/tsukuyomi/tsukuyomi_100e_4500s.pth
    # Opsional, dibuat saat training; path-nya tidak boleh mengandung "trained" (README).
    # index: C:/AI/Applio/logs/tsukuyomi/tsukuyomi.index
    pitch: 4            # semitone; diukur: edge-tts sekitar 275 Hz, korpus Tsukuyomi sekitar 351 Hz
    index_rate: 0.75    # 0-1: makin besar makin dekat ke warna suara korpus (butuh index)
    protect: 0.33       # 0-0.5: makin kecil makin melindungi konsonan dan napas; 0.5 = mati
    # Harus alamat IPv4 loopback: server RVC tanpa kata sandi hanya mendengarkan di PC
    # ini, dan "localhost" membuat setiap jawaban sekitar 2 detik lebih lambat.
    host: 127.0.0.1
    port: 9881
    startup_timeout_s: 180   # start pertama memuat model ke GPU dan bisa lama

# Avatar (README, bagian "Avatar 3D" dan "Avatar Live2D & interaksi"): maskot transparan di
# desktop yang bernapas, berkedip, menggerakkan mulut mengikuti suaranya, menunjukkan ekspresi
# jawaban, menatap kursor, dan bereaksi saat kepalanya dielus atau badannya dicolek.
# Kalau avatar gagal jalan (misalnya Electron belum dipasang), Cyrene tetap jalan tanpa avatar.
avatar:
  enabled: false
  engine: vrm             # vrm: model 3D .vrm | live2d: model Live2D Cubism (.model3.json)
  # File model, wajib diisi kalau enabled: true: .vrm untuk engine vrm, .model3.json untuk
  # engine live2d. Hanya untuk pemakaian pribadi: jangan di-commit, dibagikan, atau diunggah
  # ke mana pun.
  # model: C:/AI/avatars/tsukuyomi_a.vrm
  #
  # Live2D (engine: live2d): taruh seluruh folder model di C:/AI/avatars/ (model3.json
  # memanggil moc3, tekstur, dan physics dari foldernya sendiri), lalu isi live2d_core dengan
  # live2dcubismcore.min.js dari Cubism SDK for Web yang kamu unduh sendiri dari situs resmi
  # Live2D. Core itu milik Live2D: simpan di luar folder proyek, jangan pernah disalin ke repo.
  # engine: live2d
  # model: C:/AI/avatars/cyrene-live2d/Cyrene.model3.json
  # live2d_core: C:/AI/avatars/live2d/live2dcubismcore.min.js
  #
  # Kredit kecil yang selalu tampil di pojok halaman avatar; sesuaikan dengan modelnya.
  credit: "つくよみちゃん（© Rei Yumesaki）"
  # credit: "Cyrene © miHoYo · Live2D: MomokaSono"   # untuk model Live2D Cyrene di atas
  # Reaksi terhadap mouse, untuk kedua engine (README, bagian "Avatar Live2D & interaksi").
  # Hanya ada dua area: kepala (dielus) dan badan (dicolek).
  interactions:
    enabled: true             # false: semua reaksi mati; maskot tetap bisa digeser
    cursor_follow: true       # matanya dan kepalanya mengikuti kursor mouse
    head_pat: true            # klik atau usap kepalanya: dia senang dielus
    body_touch: true          # klik badannya: dia kaget dicolek
    double_click_listen: true # klik dua kali: dia langsung mendengarkan tanpa dipanggil namanya
    idle: true                # tampak bosan (menguap) setelah 3 menit tanpa aktivitas
    welcome_back_after_min: 10  # maskot saja: sapa Master saat mouse bergerak lagi setelah N menit diam (0 = tidak)
    reaction_cooldown_s: 3    # jeda minimal antar-reaksi bersuara, supaya klik beruntun tidak jadi spam
    # Kalimat tiap reaksi, dipilih acak dan tidak pernah sama dua kali berturut-turut.
    # Hapus satu jenis untuk memakai bawaannya; tiap jenis butuh minimal satu kalimat.
    lines:
      head_pat: ["えへへ, geli, Master!", "Hehe, makasih elusannya, Master.", "Mm, enak dielus begini."]
      body_touch: ["Hei! Kaget aku, Master.", "Eh? Ada apa, Master?", "Jangan iseng, ya!"]
      welcome_back: ["おかえりなさい, Master!", "Master sudah kembali! Aku kangen."]
      listen: ["はい, Master?", "Iya, aku dengar."]
  window: mascot          # mascot: jendela transparan Electron | app: jendela Edge | none: tanpa jendela
  width: 360              # ukuran jendela dalam piksel
  height: 640
  corner: bottom-right    # posisi awal: bottom-right | bottom-left | top-right | top-left
  always_on_top: true     # selalu di atas jendela lain
  framing: full           # full: seluruh badan | upper: setengah badan
  # Harus alamat IPv4 loopback (127.x.x.x, biasanya 127.0.0.1): halaman avatar hanya bisa
  # dibuka dari PC ini.
  host: 127.0.0.1
  port: 9882

# Teman main game HoYoverse (README, bagian "Teman main gacha"): status stamina dan daily,
# pengingat lewat suara dan HP, check-in harian HoYoLAB, dan riwayat pull (pity, 50/50).
gacha:
  enabled: false
  # Cookie login hoyolab.com: rahasia seperti kata sandi (config.yaml tidak di-commit).
  # Minimal ltuid_v2 dan ltoken_v2. Salin semuanya supaya cookie_token_v2 ikut: riwayat pull
  # tetap terbaca walau riwayat di game belum dibuka hari ini. Cara mengambilnya ada di README.
  # cookie: "ltuid_v2=...; ltoken_v2=...; ltmid_v2=...; cookie_token_v2=...; account_id_v2=...; account_mid_v2=..."
  games: [hsr, genshin, zzz]
  # uids: {hsr: 800000000}   # kosong = akun dengan level tertinggi tiap game di HoYoLAB itu
  server_utc_offset: 8       # server Asia (UTC+8): reset harian jam 04.00 waktu server
  poll_minutes: 15           # cek HoYoLAB tiap N menit selama `waifu run`
  checkin: true              # ambil hadiah check-in harian HoYoLAB otomatis
  reminders:
    stamina_minutes: 60      # ingatkan kalau stamina penuh dalam N menit (0 = saat sudah penuh)
    daily_time: "20:00"      # jam lokal; daily yang belum selesai diingatkan mulai jam ini
    weekly: true             # di hari terakhir sebelum reset mingguan
    expeditions: true        # saat semua ekspedisi selesai
  # Karakter 5★ tambahan yang berarti kalah 50/50, misalnya pilihan Celestial Invitation di HSR.
  # off_banner: {hsr: [Yunli]}
  data_dir: data/gacha

# Notifikasi ke HP lewat ntfy (aplikasi gratis, tanpa akun): langganan topik yang sama di aplikasinya.
notify:
  enabled: false
  server: https://ntfy.sh
  # Topik rahasia 16-64 huruf, angka, - atau _: siapa pun yang tahu namanya bisa membaca
  # notifikasinya. Buat dengan: python -c "import secrets; print('cyrene-' + secrets.token_urlsafe(12))"
  # topic: cyrene-isi-dengan-hasil-perintah-di-atas

# Ingatan jangka panjang (README, bagian "Ingatan Cyrene"): catatan singkat tentang Master yang
# dia simpan saat diminta ("ingat ya, ...") atau sendiri, dan dibaca lagi di awal setiap sesi.
# Rahasia (kata sandi, PIN, OTP, token, cookie, nomor kartu) selalu ditolak.
# Lihat, tambah, dan hapus catatan dengan `waifu memory list|add|forget|clear`.
memory:
  enabled: true
  path: data/memory.json   # hanya di PC ini, tidak di-commit; boleh diedit saat Cyrene mati
  max_facts: 100           # jumlah catatan paling banyak (1-500)
  max_chars: 200           # panjang satu catatan paling banyak, dalam karakter (20-1000)

# Jadwal (README, bagian "Jadwal, pengingat, dan rutinitas"): pengingat ("ingatkan aku jam 3
# sore minum obat") dan perintah perangkat atau rutinitas pada jam tertentu, sekali atau
# berulang. Semuanya hanya jalan selama `waifu run` menyala; PC sendiri tidak pernah dijadwalkan.
# Lihat dan batalkan dengan `waifu schedule list|cancel|clear`. Dengan --dry-run jadwalnya
# sementara (hilang saat ditutup) dan file di `path` tidak disentuh.
schedule:
  enabled: true
  path: data/schedule.json # hanya di PC ini, tidak di-commit; boleh diedit saat Cyrene mati
  max_entries: 50          # jumlah jadwal paling banyak (1-200)
  late_grace_minutes: 30   # jadwal yang terlewat (PC atau Cyrene mati) masih jalan kalau telat paling lama N menit (0-720)

# Rutinitas: daftar perintah perangkat yang dijalankan sekaligus, lewat suara ("Cyrene, mode
# tidur"), terjadwal ("jalankan mode tidur jam 11 malam"), atau `waifu routine run tidur`.
# Hanya kamu yang menulisnya di sini. Nama rutinitas: huruf kecil, angka, atau garis bawah;
# 1-20 langkah. Perangkatnya harus ada di `devices` di bawah, dan PC (type: pc) tidak boleh
# jadi langkah: mematikan, me-restart, atau menidurkan PC hanya lewat perintah suara langsung.
# Colokan yang mengalirkan listrik ke PC (powers_pc: true, misalnya colokan_pc) juga ditolak.
# `waifu check` memeriksa apakah setiap perintahnya ada (untuk IR: sudah dipelajari).
# routines:
#   tidur:
#     description: Mode tidur
#     steps:
#       - {device: lampu_kamar, command: off}
#       - {device: ac, command: temp, value: 26}

# Melihat layar (README, bagian "Melihat layar"): dengan otak Claude, Cyrene mengambil satu
# tangkapan layar monitor utama hanya kalau kalimat Master sendiri memintanya ("Cyrene, lihat
# layarku"), lalu menjawab tentang isinya. Gambarnya ikut dikirim ke API Anthropic bersama
# percakapan dan tidak pernah disimpan ke disk atau ditulis ke log (juga dengan -v). Dengan
# Ollama fitur ini tidak tersedia. API menerima paling besar 5 MB per gambar, dan max_side
# tidak menjaminnya: di atas sekitar 1450, layar game yang sangat ramai otomatis diambil
# sekali lagi dengan ukuran lebih kecil.
# Sudah menyala tanpa ditulis; untuk mematikannya, tulis bagian ini tanpa tanda # di depannya
# lalu ganti enabled menjadi false.
# vision:
#   enabled: true
#   max_side: 1280   # sisi terpanjang tangkapan layar dalam piksel (512-1568); tidak pernah diperbesar

# Sapaan pagi dan ringkasan harian (README, bagian "Sapaan pagi dan ringkasan harian"): sekali
# sehari, saat `waifu run` menyala pertama kali di antara `time` dan `until`, Cyrene menyapa
# Master sendiri dan merangkum harinya dalam beberapa kalimat: cuaca, jadwal dan pengingat hari
# ini, game kalau teman main gacha menyala, dan hal dari ingatannya yang penting hari ini.
# Kapan saja, "Cyrene, cuaca hari ini gimana?" memakai data yang sama. Cuaca dari Open-Meteo
# (gratis, tanpa akun atau key, butuh internet); cek dengan `waifu briefing`.
# Sudah menyala tanpa ditulis, tapi tanpa cuaca: tulis bagian ini tanpa tanda # di depannya,
# lalu ganti city dengan kotamu (atau enabled: false untuk mematikan sapaan dan ringkasannya).
# briefing:
#   enabled: true
#   time: "07:00"     # sapaan paling cepat jam ini (jam PC)
#   until: "12:00"    # dan sebelum jam ini; PC yang baru menyala sesudahnya tidak menyapa hari itu
#   city: Bandung     # kota untuk cuaca, dicari di Open-Meteo
#   # Atau koordinat persis (isi keduanya; menang atas city, yang tetap jadi nama tempat yang
#   # dia sebut), misalnya dari Google Maps:
#   # latitude: -6.9175
#   # longitude: 107.6191
#   push: true        # kirim sapaannya juga ke HP (kalau notify menyala)
#   state_path: data/briefing.json   # hari sapaan terakhir, supaya restart tidak menyapa lagi

ir_codes_path: data/ir_codes.json

devices:
  - id: lampu_kamar
    name: Lampu kamar
    aliases: [lampu, lampu utama]
    type: tuya_light
    tuya:
      device_id: "isi_dari_tinytuya_wizard"
      local_key: "isi_dari_tinytuya_wizard"
      address: Auto
      version: 3.3

  - id: ac
    name: AC Samsung
    aliases: [ac, pendingin]
    type: ir
    ir:
      backend: broadlink   # broadlink | tuya
      host: 192.168.1.50
    # Tombol remote yang ingin dipelajari (`waifu learn-ir ac --missing`).
    commands: [on, off, temp_16, temp_17, temp_18, temp_19, temp_20, temp_21, temp_22,
               temp_23, temp_24, temp_25, temp_26, temp_27, temp_28, temp_29, temp_30]

  - id: proyektor
    name: Proyektor Wanbo Dali
    aliases: [proyektor, projector]
    type: ir
    ir:
      backend: broadlink
      host: 192.168.1.50
    commands: [power, volume_up, volume_down, home, back, ok]

  - id: komputer
    name: Komputer
    aliases: [pc, komputer]
    type: pc
    pc:
      local: true          # PC yang menjalankan waifu ini
      mac: null            # isi untuk Wake-on-LAN dari perangkat lain
      shutdown_delay_s: 30

  # Colokan yang mengalirkan listrik ke PC (README, "Colokan pintar + BIOS"). powers_pc: true
  # membuatnya dijaga seperti PC: tidak pernah dijadwalkan atau jadi langkah rutinitas, dan
  # Cyrene minta konfirmasi dulu sebelum mematikannya (mematikannya = mencabut kabel PC).
  - id: colokan_pc
    name: Colokan PC
    type: tuya_plug
    powers_pc: true
    tuya:
      device_id: "isi_dari_tinytuya_wizard"
      local_key: "isi_dari_tinytuya_wizard"

  # Musik dan volume PC (README, bagian "Musik, volume, dan aplikasi PC"): tombol media dan
  # volume Windows, jadi berlaku untuk pemutar apa pun yang sedang terbuka (Spotify, YouTube
  # di browser, game), kecuali saat game yang berjalan sebagai administrator sedang aktif.
  # Perintah: play_pause, next, previous, stop, mute, volume_up dan volume_down (persen 1-100;
  # tanpa angka sekitar 10%), volume (0-100). Di rutinitas pakai stop, bukan play_pause:
  # play_pause malah memutar musik kalau tadi sedang berhenti (jadwal menolaknya). Kecilkan
  # suara dengan volume angka kecil: volume 0 juga membuat suara Cyrene tidak terdengar.
  # Misalnya langkah rutinitas tidur:
  # {device: musik, command: stop} lalu {device: musik, command: volume, value: 20}.
  # - id: musik
  #   name: Musik PC
  #   aliases: [musik, lagu, media, volume, suara]
  #   type: media

  # Aplikasi dan game di PC ini: Cyrene hanya membuka yang ada di daftar ini ("Cyrene, buka
  # Spotify" menjalankan open_spotify) dan tidak pernah menutup apa pun. Nama: huruf kecil,
  # angka, atau garis bawah; 1-30 aplikasi. Isinya path lengkap ke program (.exe), shortcut
  # (.lnk), atau shortcut internet (.url), atau URL launcher steam:// atau
  # com.epicgames.launcher://. Shortcut membuka apa pun yang ditunjuknya, jadi daftarkan hanya
  # shortcut yang kamu percayai. Ganti <nama> dengan nama user Windows-mu; nama folder dan file
  # shortcut di PC-mu bisa berbeda (cara mencarinya, juga App ID game Steam, ada di README).
  # `waifu check` menandai dengan ✗ file yang tidak ditemukan, dan shortcut .url yang tidak
  # membuka steam:// atau com.epicgames.launcher://.
  # - id: aplikasi
  #   name: Aplikasi PC
  #   aliases: [aplikasi, game]
  #   type: apps
  #   apps:
  #     spotify: "C:/Users/<nama>/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Spotify.lnk"
  #     genshin: "C:/Users/<nama>/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Genshin Impact.lnk"
  #     cyberpunk: "steam://rungameid/1091500"   # 1091500 = App ID Cyberpunk 2077 di Steam
